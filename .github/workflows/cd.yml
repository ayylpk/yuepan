# 月畔小站 · CD(部署到服务器)
#
# 走"路线 2":SSH 进服务器,就地 git 拉取 + docker compose 重建。
# 不用镜像仓库(GHCR)那套,因为服务器本来就要装 Docker 构建环境,少一个环节少一处坑。
#
# 【必须先在 GitHub 仓库里配好,否则这个工作流会红】
#   Settings → Secrets and variables → Actions → Secrets 标签页(不是 Variables!)
#     SSH_HOST   服务器 IP 或域名
#     SSH_USER   登录用户
#     SSH_KEY    私钥全文(-----BEGIN ... 到 END ... 整段粘贴)
#     SSH_PORT   可选,默认 22
#   为兼容另一些写法,下面同时接受 SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY 这几个别名,
#   哪套配了用哪套——不填对名字报的就是 "missing server host"。
#   Variables 标签页(明文,可选):
#     DEPLOY_DIR 服务器上的部署目录,默认 /srv/yuepan
#
# 触发条件:CI 跑完 **且成功** 才部署。CI 失败或被取消 = 这里什么都不做。
# 也可以手动触发(Actions 页面点 Run workflow)用来重发一次。
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false # 部署不能被打断,排队跑

jobs:
  deploy:
    name: 部署到服务器
    # 手动触发,或者 CI 真的绿了。CI 失败/取消都不动服务器
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 统一在这里做"别名兼容":左边优先,取不到就用备选。
    # 集中一处,下面调用时只写 env.X,不会漏改。
    env:
      DEP_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_HOST || secrets.HOST }}
      DEP_USER: ${{ secrets.SSH_USER || secrets.SERVER_USER || secrets.USERNAME }}
      DEP_KEY: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY_TEXT }}
      DEP_PORT: ${{ secrets.SSH_PORT || secrets.SERVER_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/srv/yuepan' }}
    steps:
      # 老版本这里写了 script_stop: true —— v1 已移除该参数(只认脚本文本里的 set -e),
      # 传了不会有副作用,但每次跑都会多一条 "Unexpected input(s)" 警告,所以撤掉。
      - name: 检查 Secrets 是否齐全(缺哪个点名报哪个)
        # 逐个探测各个候选名字有没有值,好让你直接看出"是名字不对"还是"压根没建"
        env:
          P_SSH_HOST: ${{ secrets.SSH_HOST }}
          P_SERVER_HOST: ${{ secrets.SERVER_HOST }}
          P_SSH_USER: ${{ secrets.SSH_USER }}
          P_SERVER_USER: ${{ secrets.SERVER_USER }}
          P_SSH_KEY: ${{ secrets.SSH_KEY }}
          P_SERVER_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 诊断信息一律走 ::notice:: / ::error:: ——它们会成为 check-run 注解,
          # 不用登录也能读到(公开仓库的注解接口匿名可访问),省得为看一行日志去翻网页。
          mark() { if [ -n "$1" ]; then printf '已配'; else printf '未配'; fi; }
          echo "::notice::Secret 命中表 | 地址: SSH_HOST=$(mark "$P_SSH_HOST") SERVER_HOST=$(mark "$P_SERVER_HOST") | 用户: SSH_USER=$(mark "$P_SSH_USER") SERVER_USER=$(mark "$P_SERVER_USER") | 私钥: SSH_KEY=$(mark "$P_SSH_KEY") SSH_PRIVATE_KEY=$(mark "$P_SERVER_KEY")"

          miss=""
          if [ -z "$DEP_HOST" ]; then miss=1; echo "::error::缺 Secret「服务器地址」——建 SSH_HOST(或 SERVER_HOST)"; fi
          if [ -z "$DEP_USER" ]; then miss=1; echo "::error::缺 Secret「登录用户」——建 SSH_USER(或 SERVER_USER)"; fi
          if [ -z "$DEP_KEY"  ]; then miss=1; echo "::error::缺 Secret「私钥」——建 SSH_KEY(或 SSH_PRIVATE_KEY)"; fi
          if [ -n "$miss" ]; then
            echo "建的位置:Settings → Secrets and variables → Actions 的 **Secrets** 标签页(Repository secrets)。"
            echo "常见错法:建成了 Variables(那是明文,要用 vars. 取);或建成 Environment secret(需在 job 里声明 environment 才生效)。"
            echo "网页地址:https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "地址、用户、私钥均已取到(值不打印),私钥长度 ${#DEP_KEY} 字符"
          case "$DEP_KEY" in
            *"-----BEGIN"*"PRIVATE KEY-----"*)
              echo "私钥格式看起来正确(含 BEGIN/END 标记)" ;;
            *)
              echo "::error::私钥里没找到 -----BEGIN ... PRIVATE KEY----- 标记,多半是粘贴时被截断了(或只贴了 .pub 公钥)" ;;
          esac

      - name: 远程拉取并重启容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEP_HOST }}
          username: ${{ env.DEP_USER }}
          key: ${{ env.DEP_KEY }}
          port: ${{ env.DEP_PORT }}
          # 首次在服务器上构建镜像要装依赖 + 打包,默认超时不够用
          command_timeout: 20m
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"

            # 部署目录是个 git clone。git reset --hard 只回退被跟踪的文件,
            # 不会动未跟踪的 data/(数据)与 .env(配置)—— 这两个刻意不进库。
            git fetch --all --prune
            git reset --hard "${{ github.event.workflow_run.head_sha || github.sha }}"

            # 重建并滚动替换。数据在挂载的 ./data/resources 里,不受影响。
            # 注意:api 重启后内存会话清空,需要重新登录一次(设计如此)。
            docker compose up -d --build

            # 清掉被替换下来的旧镜像层,免得服务器磁盘越跑越满
            docker image prune -f

            echo "--- 当前容器 ---"
            docker compose ps
