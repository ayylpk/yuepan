# 前端容器的 nginx:静态 dist + /api 反代到后端容器
# 这个文件同时承担三件事,每一件都对应一个"不写就出问题"的点:
#   1) client_max_body_size —— 后端没有任何上传体积限制,而 nginx 默认只有 1MB;
#      前端界面却提示用户"≤50MB"。不写这条,传一张 2MB 的照片就是 413。
#   2) try_files ... /index.html —— 前端路由是 createWebHistory(history 模式),
#      直接刷新 /notes/12 这类子页面必须回落到 index.html,否则 404。
#   3) location /api/ 反代 —— 让前后端同源,前端相对路径 /api 零改动、无跨域、
#      会话 Cookie 自动携带。
server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的构建产物:可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存,否则发版后用户还在跑旧壳
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回落(见上面第 2 条)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到后端容器:服务名 api 由 compose 的网络 DNS 解析
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传/下载大文件时不要被代理缓冲拖住(50MB 的照片会超时)
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
